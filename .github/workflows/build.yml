name: Build Python Android native artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pywasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            arguments: ""
          - python: "3.12"
            arguments: "--latest"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install numeric dependency for pywasm 1.0.8
        if: matrix.python == '3.10'
        run: python -m pip install numpy==1.26.2
      - name: Check official pywasm compatibility
        run: python native/check-pywasm.py ${{ matrix.arguments }} --output native/build/pywasm-${{ matrix.python }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pywasm-${{ matrix.python }}
          path: native/build/pywasm-${{ matrix.python }}.json
          if-no-files-found: error
  wheels:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: chaquo/chaquopy
          ref: 1f63c93d8beaf7062fbe51888ab9235475df3bb8
          path: .chaquopy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Prepare wheel build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
          python -m pip install -r .chaquopy/server/pypi/requirements.txt
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Build and verify wheels
        run: python native/build.py --abi ${{ matrix.abi }} --chaquopy .chaquopy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheels-${{ matrix.abi }}
          path: native/build/output/*
          if-no-files-found: error
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: chaquo/chaquopy
          ref: 1f63c93d8beaf7062fbe51888ab9235475df3bb8
          path: .runtime-source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: beeware/cpython-android-source-deps
          ref: 5521f2c16ee87dd7f9d081421351f675fac2ee45
          path: .source-deps
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - name: Prepare runtime build tools
        run: |
          python -m pip install Cython==3.0.11 pyelftools==0.29 pyyaml==6.0.3
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Build and verify runtime
        run: python native/runtime-build.py --abi ${{ matrix.abi }} --chaquopy .runtime-source --source-deps .source-deps
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.abi }}
          path: native/build/runtime-output/*
          if-no-files-found: error
  release:
    needs: [pywasm, wheels, runtime]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Validate and collect release assets
        run: |
          python -m pip install pyelftools==0.29
          python package_release.py --artifacts artifacts --output release --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release
          path: release/*
          if-no-files-found: error
      - name: Publish tagged native release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "$GITHUB_REF_NAME" --notes "Pinned ARM64 and ARM32 Python native runtime and wheels with source provenance and 16 KB ELF alignment checks. Device validation is reported by consumers."
